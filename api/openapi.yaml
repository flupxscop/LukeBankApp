openapi: 3.1.0
info:
  title: LuxeBank API
  version: 1.0.0-draft
  description: |
    Contract between the iOS app and the backend (spec section 9, API9).
    Money amounts are decimal strings with two fraction digits, e.g. "4825450.75".
servers:
  - url: http://localhost:8080/api/v1
    description: Local (docker-compose)

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      summary: Verify citizen ID + password and send an OTP (AUTH-01)
      operationId: startRegistration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [citizenId, password]
              properties:
                citizenId: { type: string, maxLength: 20, examples: ["1-2345-67890-12-1"] }
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                required: [otpRef, maskedPhone, expiresInSeconds]
                properties:
                  otpRef: { type: string, pattern: "^[A-Z0-9]{4}$" }
                  maskedPhone: { type: string, examples: ["08X-XXX-4521"] }
                  expiresInSeconds: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/otp/verify:
    post:
      summary: Verify the OTP and get a single-use registration token
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otpRef, code]
              properties:
                otpRef: { type: string, pattern: "^[A-Z0-9]{4}$" }
                code: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200":
          description: Code accepted
          content:
            application/json:
              schema:
                type: object
                required: [registrationToken]
                properties:
                  registrationToken: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }

  /auth/devices:
    post:
      summary: Set the PIN and bind this device (revokes any previous device, AUTH-09)
      operationId: registerDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationToken, pin, deviceName, devicePublicKey]
              properties:
                registrationToken: { type: string }
                pin: { type: string, pattern: "^\\d{6}$" }
                deviceName: { type: string, maxLength: 100 }
                devicePublicKey:
                  type: string
                  description: Base64 X9.63 uncompressed P-256 public key from the Secure Enclave
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /auth/challenge:
    post:
      summary: Single-use login challenge for a bound device
      operationId: createChallenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, format: uuid }
      responses:
        "200":
          description: Challenge to sign
          content:
            application/json:
              schema:
                type: object
                required: [challenge, expiresInSeconds]
                properties:
                  challenge: { type: string }
                  expiresInSeconds: { type: integer }
        "404": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      summary: Unlock with PIN or Face ID (AUTH-03, AUTH-04)
      description: |
        `signature` is a base64 DER ECDSA-SHA256 signature over the UTF-8 bytes of `challenge`,
        made with the device key (PIN) or the biometry-gated key (BIOMETRIC).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, challenge, signature, method]
              properties:
                deviceId: { type: string, format: uuid }
                challenge: { type: string }
                signature: { type: string }
                method: { type: string, enum: [PIN, BIOMETRIC] }
                pin: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }

  /auth/refresh:
    post:
      summary: Rotate the refresh token; reuse revokes the whole token family
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      summary: Revoke this device and all of its tokens
      operationId: logout
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }

  /auth/biometric:
    put:
      summary: Register the Face ID public key
      operationId: enableBiometric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [biometricPublicKey]
              properties:
                biometricPublicKey: { type: string }
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove the Face ID key
      operationId: disableBiometric
      responses:
        "204": { description: Disabled }

  /auth/pin:
    put:
      summary: Change the PIN
      operationId: changePin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPin, newPin]
              properties:
                currentPin: { type: string, pattern: "^\\d{6}$" }
                newPin: { type: string, pattern: "^\\d{6}$" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /me:
    get:
      summary: Signed-in customer, first name in the requested language
      operationId: getMe
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                type: object
                required: [firstName, tier, maskedPhone]
                properties:
                  firstName: { type: string }
                  tier: { type: string }
                  maskedPhone: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /dashboard:
    get:
      summary: Home screen summary
      operationId: getDashboard
      x-milestone: M2
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Dashboard data for the signed-in customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum: [th, en]
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    TraceId:
      name: X-Trace-Id
      in: header
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{8,64}$"

  responses:
    Session:
      description: Session for the bound device
      content:
        application/json:
          schema:
            type: object
            required: [deviceId, accessToken, refreshToken, expiresInSeconds]
            properties:
              deviceId: { type: string, format: uuid }
              accessToken: { type: string, description: RS256 JWT, 15 minutes }
              refreshToken: { type: string }
              expiresInSeconds: { type: integer }
    Error:
      description: Error in the shared format
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Money:
      type: string
      pattern: "^-?\\d+\\.\\d{2}$"
      examples: ["4825450.75"]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [INSUFFICIENT_FUNDS]
            message:
              type: string
            traceId:
              type: string
            remainingAttempts:
              type: integer

    Account:
      type: object
      required: [id, name, maskedNumber, balance]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        maskedNumber: { type: string, examples: ["•••• 4289"] }
        balance: { $ref: "#/components/schemas/Money" }

    Transaction:
      type: object
      required: [id, merchant, category, occurredAt, amount]
      properties:
        id: { type: string, format: uuid }
        merchant: { type: string }
        monogram: { type: [string, "null"] }
        category:
          type: string
          enum: [food, housing, investment, transport, transfer]
        occurredAt: { type: string, format: date-time }
        amount: { $ref: "#/components/schemas/Money" }

    Dashboard:
      type: object
      required: [customerFirstName, primaryAccount, monthChange, monthChangeRate, balanceHistory, cashbackThisMonth, spending, savingsGoal, recentTransactions]
      properties:
        customerFirstName: { type: string }
        primaryAccount: { $ref: "#/components/schemas/Account" }
        monthChange: { $ref: "#/components/schemas/Money" }
        monthChangeRate: { type: string, examples: ["6.8"] }
        balanceHistory:
          type: array
          items:
            type: object
            required: [date, balance]
            properties:
              date: { type: string, format: date }
              balance: { $ref: "#/components/schemas/Money" }
        cashbackThisMonth: { $ref: "#/components/schemas/Money" }
        cashbackTrend:
          type: array
          items: { $ref: "#/components/schemas/Money" }
        spending:
          type: object
          required: [categories]
          properties:
            categories:
              type: array
              items:
                type: object
                required: [kind, spent, budget]
                properties:
                  kind: { type: string, enum: [lifestyle, travel] }
                  spent: { $ref: "#/components/schemas/Money" }
                  budget: { $ref: "#/components/schemas/Money" }
        savingsGoal:
          type: object
          required: [saved, target]
          properties:
            saved: { $ref: "#/components/schemas/Money" }
            target: { $ref: "#/components/schemas/Money" }
        recentTransactions:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Transaction" }
