openapi: 3.1.0
info:
  title: LuxeBank API
  version: 1.0.0-draft
  description: |
    Contract between the iOS app and the backend (spec section 9, API9).
    Money amounts are decimal strings with two fraction digits, e.g. "4825450.75".
servers:
  - url: http://localhost:8080/api/v1
    description: Local (docker-compose)

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      summary: Verify citizen ID + password and send an OTP (AUTH-01)
      operationId: startRegistration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [citizenId, password]
              properties:
                citizenId: { type: string, maxLength: 20, examples: ["1-2345-67890-12-1"] }
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                required: [otpRef, maskedPhone, expiresInSeconds]
                properties:
                  otpRef: { type: string, pattern: "^[A-Z0-9]{4}$" }
                  maskedPhone: { type: string, examples: ["08X-XXX-4521"] }
                  expiresInSeconds: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/otp/verify:
    post:
      summary: Verify the OTP and get a single-use registration token
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otpRef, code]
              properties:
                otpRef: { type: string, pattern: "^[A-Z0-9]{4}$" }
                code: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200":
          description: Code accepted
          content:
            application/json:
              schema:
                type: object
                required: [registrationToken]
                properties:
                  registrationToken: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }

  /auth/devices:
    post:
      summary: Set the PIN and bind this device (revokes any previous device, AUTH-09)
      operationId: registerDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationToken, pin, deviceName, devicePublicKey]
              properties:
                registrationToken: { type: string }
                pin: { type: string, pattern: "^\\d{6}$" }
                deviceName: { type: string, maxLength: 100 }
                devicePublicKey:
                  type: string
                  description: Base64 X9.63 uncompressed P-256 public key from the Secure Enclave
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /auth/challenge:
    post:
      summary: Single-use login challenge for a bound device
      operationId: createChallenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, format: uuid }
      responses:
        "200":
          description: Challenge to sign
          content:
            application/json:
              schema:
                type: object
                required: [challenge, expiresInSeconds]
                properties:
                  challenge: { type: string }
                  expiresInSeconds: { type: integer }
        "404": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      summary: Unlock with PIN or Face ID (AUTH-03, AUTH-04)
      description: |
        `signature` is a base64 DER ECDSA-SHA256 signature over the UTF-8 bytes of `challenge`,
        made with the device key (PIN) or the biometry-gated key (BIOMETRIC).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, challenge, signature, method]
              properties:
                deviceId: { type: string, format: uuid }
                challenge: { type: string }
                signature: { type: string }
                method: { type: string, enum: [PIN, BIOMETRIC] }
                pin: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }

  /auth/refresh:
    post:
      summary: Rotate the refresh token; reuse revokes the whole token family
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      summary: Revoke this device and all of its tokens
      operationId: logout
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }

  /auth/biometric:
    put:
      summary: Register the Face ID public key
      operationId: enableBiometric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [biometricPublicKey]
              properties:
                biometricPublicKey: { type: string }
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove the Face ID key
      operationId: disableBiometric
      responses:
        "204": { description: Disabled }

  /auth/pin:
    put:
      summary: Change the PIN
      operationId: changePin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPin, newPin]
              properties:
                currentPin: { type: string, pattern: "^\\d{6}$" }
                newPin: { type: string, pattern: "^\\d{6}$" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /me:
    get:
      summary: Signed-in customer, first name in the requested language
      operationId: getMe
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                type: object
                required: [firstName, tier, maskedPhone]
                properties:
                  firstName: { type: string }
                  tier: { type: string }
                  maskedPhone: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /accounts:
    get:
      summary: The customer's open accounts, primary first (DASH-01, DASH-03)
      operationId: listAccounts
      responses:
        "200":
          description: Accounts with balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Error"

  /accounts/{accountId}/transactions:
    get:
      summary: History with filters and cursor pagination (TXN-01…03)
      description: Another customer's account returns 404, never 403 (BOLA, spec 13.4.4).
      operationId: listTransactions
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque; from the previous page's nextCursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Inclusive, Thai calendar day }
        - { name: to, in: query, schema: { type: string, format: date }, description: Inclusive, Thai calendar day }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: direction, in: query, schema: { type: string, enum: [in, out] } }
        - { name: q, in: query, schema: { type: string, maxLength: 50 }, description: Merchant or memo, case-insensitive literal match }
      responses:
        "200":
          description: One page, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPage" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /transactions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Transaction detail (TXN-04)
      operationId: getTransaction
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionDetail" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Change category or memo (TXN-05)
      operationId: updateTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one change. `memo` is trimmed; `clearMemo` removes it.
              properties:
                category: { $ref: "#/components/schemas/Category" }
                memo: { type: string, maxLength: 100, pattern: "^[^\\p{Cntrl}]*$" }
                clearMemo: { type: boolean, default: false }
      responses:
        "200":
          description: Updated detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionDetail" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /insights/spending:
    get:
      summary: Monthly spending against budget (DASH-06)
      description: Transfers, investments, income and cashback are not spending.
      operationId: getSpendingInsight
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: "^\\d{4}-\\d{2}$", examples: ["2026-10"] }, description: Defaults to the current Thai month }
      responses:
        "200":
          description: Spending summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendingInsight" }
        "400":
          $ref: "#/components/responses/Error"

  /banks:
    get:
      summary: Banks reachable for other-bank transfers
      operationId: listBanks
      responses:
        "200":
          description: Banks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string, examples: [KBANK] }
                    name: { type: string }
                    monogram: { type: string }

  /transfers/limits:
    get:
      summary: Daily transfer limit and what is left today (TRF-08)
      operationId: getTransferLimits
      parameters:
        - { name: accountId, in: query, schema: { type: string, format: uuid }, description: Defaults to the primary account }
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  dailyLimit: { $ref: "#/components/schemas/Money" }
                  usedToday: { $ref: "#/components/schemas/Money" }
                  remaining: { $ref: "#/components/schemas/Money" }

  /transfers/inquiry:
    post:
      summary: Check the recipient's name and price the transfer (TRF-01…06)
      description: |
        Fixes amount and recipient for 5 minutes and returns a single-use challenge.
        Rate limited per customer to stop recipient enumeration (RATE_LIMITED).
        Errors: VALIDATION_FAILED, RECIPIENT_NOT_FOUND, INSUFFICIENT_FUNDS, DAILY_LIMIT_EXCEEDED, NOT_FOUND (account not yours).
      operationId: createTransferInquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromAccountId, recipient, amount]
              properties:
                fromAccountId: { type: string, format: uuid }
                recipient: { $ref: "#/components/schemas/Recipient" }
                amount: { type: string, pattern: "^\\d{1,10}(\\.\\d{1,2})?$", examples: ["75000", "1500.50"] }
                memo: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Priced inquiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentInquiry" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /transfers:
    post:
      summary: Confirm a transfer inquiry (TRF-07, TRF-09, TRF-14)
      description: |
        The device signs the inquiry `challenge` (DER ECDSA P-256, base64): with the device key plus `pin`, or with
        the Face ID key (`method: BIOMETRIC`). From 50,000 baht only BIOMETRIC is accepted (STEP_UP_REQUIRED).
        Repeating the same Idempotency-Key returns the original slip; reusing it for another inquiry, or confirming
        an inquiry twice, returns DUPLICATE_REQUEST. Other errors: PIN_INVALID (remainingAttempts), PIN_LOCKED,
        SIGNATURE_INVALID, INQUIRY_EXPIRED, DAILY_LIMIT_EXCEEDED, SERVICE_UNAVAILABLE (nothing was deducted).
      operationId: confirmTransfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPayment" }
      responses:
        "200":
          description: Slip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSlip" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /transactions/{id}/slip:
    get:
      summary: Slip of a transfer or bill the customer paid (TRF-10)
      operationId: getSlip
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Slip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSlip" }
        "404": { $ref: "#/components/responses/Error" }

  /payees:
    get:
      summary: Favourites first, then recent recipients (TRF-11)
      description: Names and numbers are masked; pay a payee with `recipient.type = payee`.
      operationId: listPayees
      responses:
        "200":
          description: Payees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payee" }

  /payees/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Set favourite and nickname
      operationId: updatePayee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite: { type: boolean }
                nickname: { type: string, maxLength: 40 }
      responses:
        "200":
          description: Payee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payee" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a payee
      operationId: deletePayee
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }

  /billers:
    get:
      summary: Biller catalogue (BILL-01)
      operationId: listBillers
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [electricity, water, internet, mobile, credit_card, insurance, ewallet] } }
      responses:
        "200":
          description: Billers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Biller" }

  /bills/inquiry:
    post:
      summary: Look up a bill and price the payment (BILL-02, BILL-04)
      description: |
        Pass a saved bill, or a biller with ref1/ref2. `amount` is required for top-ups. For other bills it defaults
        to the amount due; billers with `partialPayment` accept less than is due, all others only the exact amount.
      operationId: createBillInquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromAccountId]
              properties:
                fromAccountId: { type: string, format: uuid }
                billerCode: { type: string }
                ref1: { type: string, pattern: "^[A-Za-z0-9]{1,32}$" }
                ref2: { type: string, pattern: "^[A-Za-z0-9]{0,32}$" }
                savedBillId: { type: string, format: uuid }
                cardId: { type: string, format: uuid, description: "Pay one of the customer's LuxeBank credit cards; settles inside the ledger" }
                amount: { type: string }
                memo: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Priced inquiry with `bill` details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentInquiry" }
        "404": { $ref: "#/components/responses/Error" }

  /bills/payments:
    post:
      summary: Confirm a bill inquiry (BILL-05); same rules as POST /transfers
      operationId: payBill
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPayment" }
      responses:
        "200":
          description: Slip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSlip" }

  /bills/saved:
    get:
      summary: Saved bills with what is due this month (BILL-03)
      operationId: listSavedBills
      responses:
        "200":
          description: Saved bills
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    biller: { $ref: "#/components/schemas/Biller" }
                    ref1: { type: string, description: Masked, e.g. x6789 }
                    nickname: { type: [string, "null"] }
                    amountDue: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
                    dueDate: { type: [string, "null"], format: date }
                    paid: { type: boolean }

  /bills/saved/{id}:
    delete:
      summary: Remove a saved bill
      operationId: deleteSavedBill
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }

  /qr/parse:
    post:
      summary: Read a Thai QR (EMVCo) payload for PromptPay or bill payment (TRF-12, BILL-02)
      description: The CRC must match and the currency must be baht; anything else is QR_INVALID.
      operationId: parseQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, maxLength: 512 }
      responses:
        "200":
          description: What to pay
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [promptpay, bill] }
                  proxy: { type: [string, "null"] }
                  billerCode: { type: [string, "null"] }
                  billerName: { type: [string, "null"] }
                  ref1: { type: [string, "null"] }
                  ref2: { type: [string, "null"] }
                  amount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
                  merchantName: { type: [string, "null"] }
                  amountLocked: { type: boolean, description: "Dynamic QR (point of initiation 12) with an amount: the payer cannot change it" }
        "400": { $ref: "#/components/responses/Error" }

  /challenges:
    post:
      summary: Single-use challenge for a step-up proof (sensitive card actions)
      description: Bound to the signed-in device, valid 2 minutes. Sign it with the device key (+ PIN) or the Face ID key.
      operationId: issueChallenge
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge: { type: string }
                  expiresInSeconds: { type: integer }

  /cards:
    get:
      summary: Active and frozen cards (CARD-01, CARD-02, CARD-08)
      operationId: listCards
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Card" }

  /cards/{id}:
    get:
      summary: One card, including a lost card's final state
      operationId: getCard
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "404": { $ref: "#/components/responses/Error" }

  /cards/{id}/transactions:
    get:
      summary: Purchases with this card and the cards it replaced (CARD-09)
      operationId: listCardTransactions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: One page, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPage" }
        "404": { $ref: "#/components/responses/Error" }

  /cards/{id}/freeze:
    post:
      summary: Freeze a card at once (CARD-03); /unfreeze reverses it
      operationId: freezeCard
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "404": { $ref: "#/components/responses/Error" }

  /cards/{id}/unfreeze:
    post:
      summary: Unfreeze a card (CARD-03)
      operationId: unfreezeCard
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }

  /cards/{id}/controls:
    patch:
      summary: Channels and daily limit (CARD-05, CARD-06)
      operationId: updateCardControls
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Omitted fields keep their value. dailyLimit must be > 0 and ≤ maxDailyLimit.
              properties:
                online: { type: boolean }
                overseas: { type: boolean }
                contactless: { type: boolean }
                atm: { type: boolean }
                dailyLimit: { $ref: "#/components/schemas/Money" }
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "400": { $ref: "#/components/responses/Error" }

  /cards/{id}/report-lost:
    post:
      summary: Block a lost or stolen card and issue a replacement (CARD-04)
      description: Needs a PIN step-up proof. Settings, points, linked account and history move to the new card.
      operationId: reportCardLost
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpProof" }
      responses:
        "200":
          description: The replacement card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /cards/{id}/sensitive:
    post:
      summary: Full card number and CVV (CARD-07)
      description: |
        Needs a BIOMETRIC step-up proof (STEP_UP_REQUIRED otherwise). Fetched from the card processor on demand,
        never stored by LuxeBank; the response is `Cache-Control: no-store` and the app hides it after `visibleForSeconds`.
      operationId: revealCard
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpProof" }
      responses:
        "200":
          description: Card details
          content:
            application/json:
              schema:
                type: object
                properties:
                  pan: { type: string }
                  cvv: { type: string }
                  expiry: { type: string, examples: ["08/30"] }
                  visibleForSeconds: { type: integer, examples: [30] }
        "403": { $ref: "#/components/responses/Error" }

  /dashboard:
    get:
      summary: Home screen summary
      operationId: getDashboard
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Dashboard data for the signed-in customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A new random value per confirmation, reused on retries (TRF-14)
      schema: { type: string, pattern: "^[A-Za-z0-9-]{16,64}$" }
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum: [th, en]
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    TraceId:
      name: X-Trace-Id
      in: header
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{8,64}$"

  responses:
    Session:
      description: Session for the bound device
      content:
        application/json:
          schema:
            type: object
            required: [deviceId, accessToken, refreshToken, expiresInSeconds]
            properties:
              deviceId: { type: string, format: uuid }
              accessToken: { type: string, description: RS256 JWT, 15 minutes }
              refreshToken: { type: string }
              expiresInSeconds: { type: integer }
    Error:
      description: Error in the shared format
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Money:
      type: string
      pattern: "^-?\\d+\\.\\d{2}$"
      examples: ["4825450.75"]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [INSUFFICIENT_FUNDS]
            message:
              type: string
            traceId:
              type: string
            remainingAttempts:
              type: integer

    Category:
      type: string
      enum: [food, shopping, housing, bills, transport, travel, other, investment, transfer, income, cashback]
      description: Clients treat unknown values as `other`.

    Account:
      type: object
      required: [id, name, maskedNumber, type, primary, balance]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        maskedNumber: { type: string, examples: ["•••• 4289"] }
        type: { type: string, enum: [current, savings] }
        primary: { type: boolean }
        balance: { $ref: "#/components/schemas/Money" }

    Transaction:
      type: object
      required: [id, accountId, merchant, category, channel, occurredAt, amount]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        merchant: { type: string }
        monogram: { type: [string, "null"] }
        category: { $ref: "#/components/schemas/Category" }
        channel: { type: string, enum: [promptpay, transfer, card, bill, deposit, interest, cashback, system] }
        occurredAt: { type: string, format: date-time }
        amount: { $ref: "#/components/schemas/Money", description: "Negative = money out" }
        memo: { type: [string, "null"] }

    TransactionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        nextCursor: { type: [string, "null"] }
        summary:
          description: Totals for the whole filtered range; first page only.
          type: [object, "null"]
          properties:
            moneyIn: { $ref: "#/components/schemas/Money" }
            moneyOut: { $ref: "#/components/schemas/Money" }

    TransactionDetail:
      type: object
      required: [transaction, referenceNo, status, account]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        referenceNo: { type: string, examples: ["LX261010K7M2Q9XA4C"] }
        status: { type: string, enum: [pending, posted, failed, reversed] }
        hasSlip: { type: boolean, description: "GET /transactions/{id}/slip returns it" }
        account:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            maskedNumber: { type: string }

    SpendingInsight:
      type: object
      properties:
        month: { type: string, examples: ["2026-10"] }
        totalSpent: { $ref: "#/components/schemas/Money" }
        totalBudget: { $ref: "#/components/schemas/Money" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/KindSpending" }
        byCategory:
          type: array
          items:
            type: object
            properties:
              category: { $ref: "#/components/schemas/Category" }
              spent: { $ref: "#/components/schemas/Money" }

    KindSpending:
      type: object
      required: [kind, spent, budget]
      properties:
        kind: { type: string, enum: [lifestyle, travel] }
        spent: { $ref: "#/components/schemas/Money" }
        budget: { $ref: "#/components/schemas/Money", description: "0.00 when no budget is set" }

    Recipient:
      type: object
      required: [type]
      description: own → accountId · internal → accountNumber · other_bank → bankCode + accountNumber · promptpay → proxy · payee → payeeId
      properties:
        type: { type: string, enum: [own, internal, other_bank, promptpay, payee] }
        accountId: { type: string, format: uuid }
        bankCode: { type: string }
        accountNumber: { type: string, examples: ["123-4-56789-0"] }
        proxy: { type: string, description: Mobile number, national ID or e-wallet ID }
        payeeId: { type: string, format: uuid }

    Party:
      type: object
      properties:
        name: { type: string, description: Masked for other people, e.g. "นาย สมชาย ใจ**" }
        bankCode: { type: [string, "null"] }
        bankName: { type: [string, "null"] }
        account: { type: [string, "null"], examples: [x6789] }

    BillInfo:
      type: [object, "null"]
      properties:
        billerCode: { type: string }
        billerName: { type: string }
        ref1: { type: string }
        ref2: { type: [string, "null"] }
        customerName: { type: string }
        dueDate: { type: [string, "null"], format: date }

    PaymentInquiry:
      type: object
      properties:
        inquiryId: { type: string, format: uuid }
        challenge: { type: string, description: Sign this to confirm; single use }
        expiresAt: { type: string, format: date-time }
        recipientType: { type: string, enum: [own, internal, other_bank, promptpay, bill] }
        amount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        memo: { type: [string, "null"] }
        from: { $ref: "#/components/schemas/Party" }
        to: { $ref: "#/components/schemas/Party" }
        requiresBiometric: { type: boolean, description: true from 50,000 baht (TRF-09) }
        bill: { $ref: "#/components/schemas/BillInfo" }

    ConfirmPayment:
      type: object
      required: [inquiryId, method, signature]
      properties:
        inquiryId: { type: string, format: uuid }
        method: { type: string, enum: [PIN, BIOMETRIC] }
        signature: { type: string, description: base64 DER ECDSA over the challenge }
        pin: { type: string, description: Required with method PIN }
        saveAsFavorite: { type: boolean, default: false }
        saveBill: { type: boolean, default: false }

    PaymentSlip:
      type: object
      properties:
        transactionId: { type: string, format: uuid }
        referenceNo: { type: string }
        recipientType: { type: string }
        occurredAt: { type: string, format: date-time }
        amount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        memo: { type: [string, "null"] }
        from: { $ref: "#/components/schemas/Party" }
        to: { $ref: "#/components/schemas/Party" }
        slipQr: { type: string, description: Thai slip-verification mini QR (tags 00, 51, 91 CRC) }
        bill: { $ref: "#/components/schemas/BillInfo" }

    Payee:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [internal, other_bank, promptpay] }
        name: { type: string }
        nickname: { type: [string, "null"] }
        bankCode: { type: [string, "null"] }
        bankName: { type: [string, "null"] }
        account: { type: string }
        favorite: { type: boolean }
        lastUsedAt: { type: string, format: date-time }

    Biller:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string }
        ref1Label: { type: string }
        ref2Label: { type: [string, "null"] }
        topUp: { type: boolean }
        monogram: { type: string }
        partialPayment: { type: boolean, description: "Cards and insurance: any amount up to what is due. Others: exactly the amount due." }

    StepUpProof:
      type: object
      required: [challenge, method, signature]
      properties:
        challenge: { type: string, description: From POST /challenges }
        method: { type: string, enum: [PIN, BIOMETRIC] }
        signature: { type: string, description: base64 DER ECDSA over the challenge }
        pin: { type: string }

    Card:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [debit, credit] }
        productName: { type: string }
        last4: { type: string }
        expiry: { type: string, examples: ["08/30"] }
        status: { type: string, enum: [active, frozen, lost, closed] }
        channels:
          type: object
          properties:
            online: { type: boolean }
            overseas: { type: boolean }
            contactless: { type: boolean }
            atm: { type: boolean }
        dailyLimit: { $ref: "#/components/schemas/Money" }
        maxDailyLimit: { $ref: "#/components/schemas/Money" }
        rewardPoints: { type: integer }
        travelInsurance: { type: boolean }
        credit:
          type: [object, "null"]
          description: Credit cards only (simulated statement)
          properties:
            limit: { $ref: "#/components/schemas/Money" }
            used: { $ref: "#/components/schemas/Money" }
            available: { $ref: "#/components/schemas/Money" }
            minimumPayment: { $ref: "#/components/schemas/Money" }
            dueDate: { type: [string, "null"], format: date }
        linkedAccount: { type: [string, "null"], description: "Debit cards: masked account they spend from" }
        linkedBalance: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }

    Dashboard:
      type: object
      required: [customerFirstName, primaryAccount, accounts, monthChange, monthChangeRate, balanceHistory, cashbackThisMonth, cashbackTrend, spending, recentTransactions]
      properties:
        customerFirstName: { type: string, description: In the Accept-Language language }
        primaryAccount: { $ref: "#/components/schemas/Account" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        monthChange: { $ref: "#/components/schemas/Money", description: Balance change over 30 days }
        monthChangeRate: { type: string, examples: ["6.8"], description: Percent, one decimal }
        balanceHistory:
          type: array
          description: Closing balance for each of the last 365 days, oldest first
          items:
            type: object
            required: [date, balance]
            properties:
              date: { type: string, format: date }
              balance: { $ref: "#/components/schemas/Money" }
        cashbackThisMonth: { $ref: "#/components/schemas/Money" }
        cashbackTrend:
          type: array
          description: Weekly cashback for the last 5 weeks, oldest first
          items: { $ref: "#/components/schemas/Money" }
        spending:
          type: object
          required: [categories]
          properties:
            categories:
              type: array
              items: { $ref: "#/components/schemas/KindSpending" }
        savingsGoal:
          type: [object, "null"]
          required: [name, saved, target]
          properties:
            name: { type: string }
            saved: { $ref: "#/components/schemas/Money" }
            target: { $ref: "#/components/schemas/Money" }
        recentTransactions:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Transaction" }
