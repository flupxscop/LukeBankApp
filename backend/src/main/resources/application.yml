spring:
  application:
    name: luxebank-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/luxebank}
    username: ${DB_USERNAME:luxebank}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: false

server:
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
