spring:
  application:
    name: luxebank-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/luxebank}
    username: ${DB_USERNAME:luxebank}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: false

server:
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
    # NFR-05, spec 13.4.4: account, card and ID numbers (10-19 digits) and JWTs are masked in every message and
    # stack trace, including exception messages we do not control (e.g. SQL errors). %nopex stops logback from
    # appending the unmasked exception a second time.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} ${LOG_LEVEL_PATTERN} %logger{40} : %replace(%m%n%wEx){'\\d{10,19}|eyJ[\\w-]+\\.[\\w-]+\\.[\\w-]+', '[masked]'}%nopex"

luxebank:
  # Which adapter serves each external system (spec 7.0, D26). `stub` = the simulator in integration/stub.
  # To go live with one system: implement its port in integration/<provider>, annotate it with
  # @ConditionalOnProperty(prefix = "luxebank.integrations", name = ["<key>"], havingValue = "<provider>")
  # and set the key here. The `prod` profile refuses to start while any stub is active.
  integrations:
    otp: stub
    interbank: stub
    promptpay: stub
    bills: stub
    cards: stub
    push: stub
  security:
    pepper: ${LUXEBANK_PEPPER}
    identity-key: ${LUXEBANK_IDENTITY_KEY}
    # jwt.private-key / jwt.public-key come from LUXEBANK_SECURITY_JWT_PRIVATE_KEY / _PUBLIC_KEY (KMS) in production.
