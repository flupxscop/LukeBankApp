# Local development against docker-compose. Never use these values outside a laptop.
spring:
  datasource:
    # From .env (see .env.example); no default.
    password: ${DB_PASSWORD}

luxebank:
  security:
    pepper: ${LUXEBANK_PEPPER:local-only-pepper-not-secret}
    identity-key: ${LUXEBANK_IDENTITY_KEY:local-only-identity-key-not-secret}
