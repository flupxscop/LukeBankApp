# Local development stack (spec D5). Ports bind to localhost only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luxebank
      POSTGRES_USER: luxebank
      POSTGRES_PASSWORD: ${DB_PASSWORD:-luxebank-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxebank -d luxebank"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/luxebank
      DB_USERNAME: luxebank
      DB_PASSWORD: ${DB_PASSWORD:-luxebank-local}
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
