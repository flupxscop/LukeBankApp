name: LuxeBank
options:
  bundleIdPrefix: com.luxebank
  developmentLanguage: th
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  LuxeBank:
    type: application
    platform: iOS
    sources:
      - path: LuxeBank
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luxebank.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: LuxeBank
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSFaceIDUsageDescription: "ใช้ Face ID เพื่อปลดล็อกแอปและยืนยันธุรกรรม"
        ENABLE_PREVIEWS: YES
    postBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftlint > /dev/null; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed"
          fi

  LuxeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LuxeBankTests
    dependencies:
      - target: LuxeBank
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luxebank.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LuxeBank.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LuxeBank"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LuxeBank:
    build:
      targets:
        LuxeBank: all
        LuxeBankTests: [test]
    test:
      targets:
        - LuxeBankTests
      gatherCoverageData: true
      coverageTargets:
        - LuxeBank
    run:
      config: Debug
    archive:
      config: Release
